---
layout: default
title: Public Training Programs
description: Search our upcoming HRDC claimable public programs.
---

<main>
  <section id="hero">
    <h1>Public Training Programs</h1>
    <p>Discover our upcoming HRDC claimable public programs.</p>
  </section>

  <div class="content-wrapper">
    <!-- Search -->
    <div style="margin-bottom: 22px;">
      <input type="text" id="moduleSearch" placeholder="Search programs..." style="width: 100%; max-width: 420px; padding: 11px; border: 1px solid #d0d7de; border-radius: 6px;">
    </div>

    <!-- Table -->
    <div id="tableCard" style="background: #fff; border: 1px solid #e6ebf0; border-radius: 8px; overflow: hidden;">
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85em;">
          <thead>
            <tr style="background: #12425c; color: #fff;">
              <th style="padding: 12px; text-align: left;">Program Title</th>
              <th style="padding: 12px; text-align: center;">Date</th>
              <th style="padding: 12px; text-align: center;">Duration</th>
              <th style="padding: 12px; text-align: center;">Venue</th>
              <th style="padding: 12px; text-align: center;">HRDC</th>
              <th style="padding: 12px; text-align: center;">Action</th>
            </tr>
          </thead>
          <tbody id="moduleBody"></tbody>
        </table>
      </div>
    </div>

    <!-- Request Form (Hidden by default) -->
    <div id="requestPanel" style="display: none; margin-top: 28px; background: #fff; border: 1px solid #e6ebf0; border-left: 4px solid #12425c; padding: 20px;">
      <h2 style="color:#12425c; font-size:1.2em;">Request Brochure</h2>
      <p>Program: <strong id="selectedModuleName"></strong></p>
      <form id="brochureForm" style="display:grid; gap:10px; max-width:400px;">
        <input type="hidden" id="moduleTitleField" name="module_title">
        <input type="text" name="full_name" placeholder="Full Name" required style="padding:8px;">
        <input type="email" name="email" placeholder="Corporate Email" required style="padding:8px;">
        <button type="submit" style="background:#12425c; color:#fff; border:none; padding:10px; cursor:pointer;">Send Request</button>
        <button type="button" id="cancelRequest" style="background:#eee; padding:10px; border:none; cursor:pointer;">Cancel</button>
      </form>
    </div>
  </div>
</main>

<script>
// Use this format for your full list
const PROGRAMS = [
  { title: "Strategic Supply Chain Management", date: "15–16 Oct 2026", duration: "2 Days", venue: "Kuala Lumpur", hrdc: "Yes", action: "Full" },
  { title: "Mastering Employment Act", date: "19 Oct 2026", duration: "1 Day", venue: "Online", hrdc: "Yes", action: "Full" },
  { title: "Advanced Microsoft Excel", date: "14-15 Dec 2026", duration: "2 Days", venue: "Kuala Lumpur", hrdc: "Yes", action: "Request" }
];

const body = document.getElementById("moduleBody");

function renderTable(data) {
  body.innerHTML = "";
  data.forEach((p, i) => {
    const tr = document.createElement("tr");
    tr.style.borderBottom = "1px solid #eee";
    tr.style.backgroundColor = i % 2 === 0 ? "#fff" : "#f9f9f9";
    
    const actionCell = p.action === "Full" 
      ? "Full" 
      : `<button onclick="openRequest('${p.title}')" style="background:#12425c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Request</button>`;

    tr.innerHTML = `
      <td style="padding: 12px;">${p.title}</td>
      <td style="padding: 12px; text-align: center;">${p.date}</td>
      <td style="padding: 12px; text-align: center;">${p.duration}</td>
      <td style="padding: 12px; text-align: center;">${p.venue}</td>
      <td style="padding: 12px; text-align: center;">${p.hrdc}</td>
      <td style="padding: 12px; text-align: center;">${actionCell}</td>
    `;
    body.appendChild(tr);
  });
}

function openRequest(title) {
  document.getElementById("selectedModuleName").textContent = title;
  document.getElementById("moduleTitleField").value = title;
  document.getElementById("requestPanel").style.display = "block";
}

document.getElementById("moduleSearch").addEventListener("input", (e) => {
  const filtered = PROGRAMS.filter(p => p.title.toLowerCase().includes(e.target.value.toLowerCase()));
  renderTable(filtered);
});

document.getElementById("cancelRequest").addEventListener("click", () => {
  document.getElementById("requestPanel").style.display = "none";
});

renderTable(PROGRAMS);
</script>
