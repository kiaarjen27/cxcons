---
layout: default
title: Public Training Programs
description: Search our upcoming HRDC claimable public programs.
---

<main>
  <section id="hero">
    <h1>Public Training Programs</h1>
    <p>Discover our upcoming HRDC claimable public programs.</p>
  </section>

  <div class="content-wrapper">
    <!-- Search -->
    <div style="margin-bottom: 22px;">
      <input type="text" id="moduleSearch" placeholder="Search programs..." style="width: 100%; max-width: 420px; padding: 11px; border: 1px solid #d0d7de; border-radius: 6px;">
    </div>

    <!-- Table -->
    <div id="tableCard" style="background: #fff; border: 1px solid #e6ebf0; border-radius: 8px; overflow: hidden;">
      <div style="overflow-x: auto;">
        <table style="width: 100%; border-collapse: collapse; font-size: 0.85em;">
          <thead>
            <tr style="background: #12425c; color: #fff;">
              <th style="padding: 12px; text-align: left;">Program Title</th>
              <th style="padding: 12px; text-align: center;">Date</th>
              <th style="padding: 12px; text-align: center;">Duration</th>
              <th style="padding: 12px; text-align: center;">Venue</th>
              <th style="padding: 12px; text-align: center;">HRDC</th>
              <th style="padding: 12px; text-align: center;">Action</th>
            </tr>
          </thead>
          <tbody id="moduleBody"></tbody>
        </table>
      </div>
    </div>

<!-- Request Form -->
<div id="requestPanel" style="display: none; margin-top: 28px; background: #fff; border: 1px solid #e6ebf0; border-left: 4px solid #12425c; border-radius: 8px; padding: 24px 20px;">
  <h2 style="color:#12425c; font-size:1.2em; margin:0 0 6px;">Request Information</h2>
  <p style="color:#555; font-size:0.85em; margin:0 0 18px;">
    Selected: <strong id="selectedModuleName">—</strong> (<span id="selectedModuleDate">—</span>)
  </p>

  <form id="brochureForm" style="display:grid; gap:12px; max-width:480px;">
    <!-- Hidden fields to pass data to App Script -->
    <input type="hidden" id="moduleTitleField" name="module_title">
    <input type="hidden" id="moduleDateField" name="module_date">

    <div>
      <label style="display:block; font-size:0.8em; color:#555; margin-bottom:5px;">Full Name *</label>
      <input type="text" name="full_name" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
    </div>

    <div>
      <label style="display:block; font-size:0.8em; color:#555; margin-bottom:5px;">Corporate Email *</label>
      <input type="email" name="email" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
    </div>

    <div>
  <label style="display:block; font-size:0.8em; color:#555; margin-bottom:5px;">Contact Number *</label>
  <input type="tel" name="phone" required style="width:100%; padding:10px; border:1px solid #ccc; border-radius:4px; box-sizing:border-box;">
</div>

    <div style="display:flex; gap:10px; margin-top:5px;">
      <button type="submit" style="background:#12425c; color:#fff; border:none; padding:10px 20px; border-radius:4px; cursor:pointer;">Send Request</button>
      <button type="button" id="cancelRequest" style="background:#f4f5f7; border:1px solid #ccc; padding:10px 20px; border-radius:4px; cursor:pointer;">Cancel</button>
    </div>
  </form>
</div>
  </div>
</main>

<script>
// Use this format for your full list
const PROGRAMS = [
  { title: "Strategic Supply Chain Management", date: "15–16 Oct 2026", duration: "2 Days", venue: "Kuala Lumpur", hrdc: "Yes", action: "Full" },
  { title: "Mastering Employment Act", date: "19 Oct 2026", duration: "1 Day", venue: "Online", hrdc: "Yes", action: "Full" },
  { title: "Advanced Microsoft Excel", date: "14-15 Dec 2026", duration: "2 Days", venue: "Kuala Lumpur", hrdc: "Yes", action: "Request" }
];

const body = document.getElementById("moduleBody");

function renderTable(data) {
  body.innerHTML = "";
  data.forEach((p, i) => {
    const tr = document.createElement("tr");
    tr.style.borderBottom = "1px solid #eee";
    tr.style.backgroundColor = i % 2 === 0 ? "#fff" : "#f9f9f9";
    
    const actionCell = p.action === "Full" 
      ? "Full" 
      : `<button type="button" onclick="openRequest('${p.title.replace(/'/g, "\\'")}', '${p.date.replace(/'/g, "\\'")}')" style="background:#12425c; color:white; border:none; padding:5px 10px; border-radius:4px; cursor:pointer;">Request</button>`;

    tr.innerHTML = `
      <td style="padding: 12px;">${p.title}</td>
      <td style="padding: 12px; text-align: center;">${p.date}</td>
      <td style="padding: 12px; text-align: center;">${p.duration}</td>
      <td style="padding: 12px; text-align: center;">${p.time || '-'}</td>
      <td style="padding: 12px; text-align: center;">${p.venue}</td>
      <td style="padding: 12px; text-align: center;">${p.hrdc}</td>
      <td style="padding: 12px; text-align: center;">${actionCell}</td>
    `;
    body.appendChild(tr);
  });
}

function openRequest(title, date) {
  // Update the hidden fields so App Script receives the data
  document.getElementById("moduleTitleField").value = title;
  document.getElementById("moduleDateField").value = date;
  
  // Update the display text so the user knows what they are requesting
  document.getElementById("selectedModuleName").textContent = title;
  document.getElementById("selectedModuleDate").textContent = date;
  
  // Display the panel
  document.getElementById("requestPanel").style.display = "block";
  document.getElementById("requestPanel").scrollIntoView({ behavior: "smooth", block: "start" });
}

document.getElementById("moduleSearch").addEventListener("input", (e) => {
  const filtered = PROGRAMS.filter(p => 
    p.title.toLowerCase().includes(e.target.value.toLowerCase()) || 
    p.date.toLowerCase().includes(e.target.value.toLowerCase())
  );
  renderTable(filtered);
});

document.getElementById("cancelRequest").addEventListener("click", () => {
  document.getElementById("requestPanel").style.display = "none";
});

// Initial render
renderTable(PROGRAMS);
</script>
